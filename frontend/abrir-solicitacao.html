<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Abrir Solicitação | TextQualid</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>TextQualid</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="abrir-solicitacao.html">Abrir solicitação</a>
            <a href="acompanhar.html">Acompanhar</a>
        </nav>
    </header>

    <main class="container">

        <section class="formulario-container">

            <h2>Abrir Solicitação</h2>

            <p class="descricao">
                Preencha os campos abaixo para registrar
                sua solicitação de atendimento acadêmico.
            </p>

            <form id="formSolicitacao">

                <div class="campo">
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="campo">
                    <label for="matricula">Matrícula:</label>
                    <input type="text" id="matricula" name="matricula" placeholder="Digite sua matrícula" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="campo">
                    <label for="categoria">Categoria:</label>

                    <select id="categoria" name="categoria" required>
                        <option value="">Selecione uma categoria</option>
                        <option value="Financeiro">Financeiro</option>
                        <option value="Matrícula">Matrícula</option>
                        <option value="Documentação">Documentação</option>
                        <option value="Acadêmico">Acadêmico</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="assunto">Assunto:</label>
                    <input type="text" id="assunto" name="assunto" placeholder="Digite o assunto da solicitação"
                        required>
                </div>

                <div class="campo">
                    <label for="descricao">Descrição:</label>
                    <textarea id="descricao" name="descricao" rows="5" placeholder="Descreva sua solicitação..."
                        required></textarea>
                </div>

                <button type="submit" class="botao">
                    Enviar solicitação
                </button>

                <a href="index.html" class="voltar">
                    Voltar para o início
                </a>

            </form>

        </section>

    </main>

    <footer>
        <p>TextQualid - Sistema de Atendimento Acadêmico</p>
    </footer>

<script src="js/abrir-solicitacao.js"></script>
    
</body>

</html>
